<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oaksy — Out-coach the coach</title>
    <meta
      name="description"
      content="The arena where fans out-coach the coach — and settle it with data."
    />
  </head>
  <body>
    <script>
      // Set the theme before paint to avoid a flash of the wrong one.
      (function () {
        try {
          var t = localStorage.getItem("oaksy_theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
