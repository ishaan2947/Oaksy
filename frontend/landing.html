<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Oaksy — Out-coach the coach</title>
    <meta
      name="description"
      content="The arena where fans out-coach the coach — and settle it with data. Daily game-decision calls, an AI verdict, and a Coach Score worth bragging about."
    />
    <meta property="og:title" content="Oaksy — Out-coach the coach" />
    <meta
      property="og:description"
      content="One real game decision a day. 30 seconds. Beat the coach and settle it with data."
    />
  </head>
  <body>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("oaksy_theme");
          if (t !== "light" && t !== "dark") {
            t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <div id="landing"></div>
    <script type="module" src="/src/landing.jsx"></script>
  </body>
</html>
