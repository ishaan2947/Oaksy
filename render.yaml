# One-click deploy on Render (https://render.com). From the dashboard:
#   New + → Blueprint → point at this repo. Render reads this file.
#
# It provisions a free Postgres and a Docker web service that serves BOTH the
# API and the web app at one URL. Set ANTHROPIC_API_KEY in the dashboard to turn
# on real Claude verdicts (the app runs fine without it).
services:
  - type: web
    name: oaksy
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: oaksy-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: ANTHROPIC_API_KEY
        sync: false # set this yourself in the dashboard (optional)

databases:
  - name: oaksy-db
    plan: free
